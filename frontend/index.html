<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b6e4f"><title>Consulta Certa | Acesso</title><link rel="stylesheet" href="css/style.css"></head>
<body class="pagina-acesso">
  <main class="acesso-layout">
    <section class="apresentacao"><span class="marca">Consulta Certa</span><h1>Uma vaga confirmada é uma vaga que não fica ociosa.</h1><p>Agende consultas, confirme sua presença e acompanhe sua fila de espera na UBS.</p><div class="dado-destaque"><strong>19,2%</strong><span>de faltas em consultas médicas encontradas por um estudo em UBS do sul do Brasil</span></div></section>
    <section class="cartao acesso-cartao"><div class="abas" role="tablist"><button class="aba ativa" type="button" data-formulario="login">Entrar</button><button class="aba" type="button" data-formulario="cadastro">Criar conta</button></div>
      <form id="form-login" class="formulario"><h2>Bem-vindo de volta</h2><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button class="botao principal" type="submit">Entrar</button></form>
      <form id="form-cadastro" class="formulario oculto"><h2>Crie sua conta de paciente</h2><label>Nome completo<input name="nome" autocomplete="name" minlength="2" maxlength="120" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha (mínimo 8 caracteres)<input name="senha" type="password" autocomplete="new-password" minlength="8" required></label><button class="botao principal" type="submit">Cadastrar</button></form>
      <p id="mensagem-acesso" class="mensagem" aria-live="polite"></p></section>
  </main><script src="js/app.js"></script>
</body></html>
